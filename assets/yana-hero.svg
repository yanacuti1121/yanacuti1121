<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Vũ Văn Tâm — Creator &amp; Founder of Yana AI</title>
  <desc id="desc">AI works. You keep authority. Models propose, Yana decides, humans can always stop it. Built on the Yana 2026 porcelain-ink aesthetic from yana.vutam.link.</desc>
  <defs>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#f3f7fc"/>
      <stop offset="1" stop-color="#eaf1fa"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f80ff"/>
      <stop offset="0.52" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eff8"/>
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6785ab"/>
      <stop offset="1" stop-color="#3f618d"/>
    </linearGradient>
    <radialGradient id="softGlow1" cx="0.2" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softGlow2" cx="0.82" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.15" fill="#94a3b8" fill-opacity="0.28"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="pillShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141822" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Outer Porcelain Frame -->
  <rect width="1200" height="440" rx="32" fill="url(#canvasBg)" stroke="#d6e1ef" stroke-width="1.5"/>
  <rect width="1200" height="440" rx="32" fill="url(#softGlow1)"/>
  <rect width="1200" height="440" rx="32" fill="url(#softGlow2)"/>
  <rect x="16" y="16" width="1168" height="408" rx="24" fill="url(#dotGrid)"/>

  <!-- Floating Vocabulary Stickers (Left & Right, matching yana.vutam.link) -->
  <!-- Top Left: SUPERVISED -->
  <g transform="translate(58, 56) rotate(-7)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="132" height="38" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="18" cy="19" r="5" fill="#3b82f6"/>
    <text x="32" y="24" fill="#1e3a8a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.6">SUPERVISED</text>
  </g>

  <!-- Mid Left: ALLOW: read -->
  <g transform="translate(42, 184) rotate(5)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="136" height="38" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="11" y="10" width="18" height="18" rx="5" fill="#dcfce7"/>
    <path d="M16 19.5 l3 3 l6 -6.5" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="24" fill="#166534" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">ALLOW: read</text>
  </g>

  <!-- Bottom Left: DENY rm -rf -->
  <g transform="translate(64, 314) rotate(-6)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="144" height="38" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <rect x="10" y="10" width="38" height="18" rx="5" fill="#e11d48"/>
    <text x="29" y="23" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="800">DENY</text>
    <text x="56" y="24" fill="#9f1239" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">rm -rf ~/</text>
  </g>

  <!-- Top Right: REQUIRE: run -->
  <g transform="translate(1002, 54) rotate(6)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="144" height="38" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="10" y="10" width="32" height="18" rx="5" fill="#f59e0b"/>
    <text x="26" y="23" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="800">ASK</text>
    <text x="50" y="24" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">REQUIRE: run</text>
  </g>

  <!-- Mid Right: SHA-256 Audit -->
  <g transform="translate(1014, 182) rotate(-5)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="144" height="38" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <circle cx="19" cy="19" r="5" fill="#6366f1"/>
    <text x="32" y="24" fill="#3730a3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">Audit 500✓ 0✗</text>
  </g>

  <!-- Bottom Right: Core-lock -->
  <g transform="translate(992, 312) rotate(5)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="150" height="38" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="11" y="10" width="18" height="18" rx="5" fill="#f1f5f9"/>
    <circle cx="20" cy="19" r="4" fill="#334155"/>
    <text x="36" y="24" fill="#1e293b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">290 core-lock</text>
  </g>

  <!-- Top Pill Badge (Exact hero26-badge style from yana.vutam.link) -->
  <g transform="translate(390, 38)" filter="url(#pillShadow)">
    <rect x="0" y="0" width="420" height="42" rx="21" fill="#17181c"/>
    <!-- Official Yana Mark inside circle -->
    <g transform="translate(8, 6)">
      <rect x="0" y="0" width="30" height="30" rx="9" fill="url(#tileBg)" stroke="#cad7e7" stroke-width="1"/>
      <path d="M8.5 8h4l3.5 5.5 3.5-5.5h4L18 17v7.5h-4V17L8.5 8Z" fill="url(#glyphGrad)"/>
      <circle cx="24.5" cy="24" r="1.6" fill="#9ab1cb"/>
    </g>
    <text x="48" y="26" fill="#ffffff" font-family="Nunito, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800">Vũ Văn Tâm</text>
    <circle cx="144" cy="21" r="2" fill="#64748b"/>
    <text x="155" y="26" fill="#b9c3d3" font-family="Nunito, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Creator &amp; Founder of Yana AI · yana.vutam.link</text>
  </g>

  <!-- Center Hero Typography -->
  <g font-family="Nunito, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="600" y="158" fill="#17181c" font-size="64" font-weight="900" letter-spacing="-1.8">AI does the work.</text>
    <text x="600" y="232" font-size="64" font-weight="900" letter-spacing="-1.8">
      <tspan fill="#17181c">You </tspan>
      <tspan fill="url(#markGrad)">keep authority</tspan><tspan fill="#17181c">.</tspan>
    </text>
    <!-- Signature hand-drawn double underline under "keep authority" (matching hero26-scribble) -->
    <path d="M515 247 C 610 237, 730 253, 895 241" fill="none" stroke="#17181c" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M555 254 C 660 247, 775 256, 875 249" fill="none" stroke="#17181c" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Subtitle -->
    <text x="600" y="292" fill="#334155" font-size="19" font-weight="700">
      Models propose. Yana decides. Humans can always stop it.
    </text>
    <text x="600" y="318" fill="#64748b" font-size="14.5" font-weight="600">
      Mô hình đề xuất · Yana quyết định · Con người luôn giữ quyền dừng cuối cùng
    </text>
  </g>

  <!-- Bottom Metrics Bar (Grounded in First Public Project Report, 26 Oct 2026) -->
  <g transform="translate(155, 348)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="890" height="58" rx="18" fill="#ffffff" stroke="#dbe4f0" stroke-width="1.5"/>
    <g font-family="Nunito, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
      <text x="95" y="26" fill="#17181c" font-size="16" font-weight="900">Yana Studio 1.7</text>
      <text x="95" y="44" fill="#64748b" font-size="11.5" font-weight="700">Code-OSS 1.141 · macOS</text>

      <line x1="190" y1="12" x2="190" y2="46" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="285" y="26" fill="#17181c" font-size="16" font-weight="900">82,133 LOC Rust</text>
      <text x="285" y="44" fill="#64748b" font-size="11.5" font-weight="700">yana-rt · 313 files · 4.16 ms boot</text>

      <line x1="385" y1="12" x2="385" y2="46" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="475" y="26" fill="#17181c" font-size="16" font-weight="900">19 Model Providers</text>
      <text x="475" y="44" fill="#64748b" font-size="11.5" font-weight="700">13 Cloud + 6 Local runtimes</text>

      <line x1="568" y1="12" x2="568" y2="46" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="655" y="26" fill="#17181c" font-size="16" font-weight="900">2,488 Commits</text>
      <text x="655" y="44" fill="#64748b" font-size="11.5" font-weight="700">426 PRs · 41 Releases</text>

      <line x1="742" y1="12" x2="742" y2="46" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="816" y="26" fill="#0284c7" font-size="15" font-weight="900">Apache-2.0</text>
      <text x="816" y="44" fill="#64748b" font-size="11.5" font-weight="700">VN · KR · Open Source</text>
    </g>
  </g>
</svg>
