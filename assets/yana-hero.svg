<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Yana AI: AI does the work. You keep authority.</title>
  <desc id="d">Models propose, Yana decides, humans can always stop it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf1fa"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f80ff"/><stop offset="0.55" stop-color="#0ea5e9"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="23.5" fill="none" stroke="#d7e2f2" stroke-width="1.5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="62" font-size="17" font-weight="700" letter-spacing="3" fill="#5d6591">YANA AI</text>
    <text x="600" y="150" font-size="60" font-weight="800" fill="#1d2552">AI does the work.</text>
    <text x="600" y="224" font-size="60" font-weight="800" fill="#1d2552">You <tspan fill="url(#ac)">keep authority.</tspan></text>
    <rect x="456" y="246" width="288" height="5" rx="2.5" fill="url(#ac)"/>
    <text x="600" y="282" font-size="20" fill="#3d4570">Models propose. Yana decides. Humans can always stop it.</text>
    <text x="600" y="311" font-size="16" fill="#7a82a8">Mô hình đề xuất, Yana quyết định, con người luôn dừng được.</text>
  </g>
</svg>
