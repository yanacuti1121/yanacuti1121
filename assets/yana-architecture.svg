<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Yana AI system architecture</title>
  <desc id="desc">Local and cloud models and coding agents connect through providers and adapters to yana-rt, deterministic governance, human authority, Yana OS and Giám Thị.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100817"/>
      <stop offset="0.55" stop-color="#17112b"/>
      <stop offset="1" stop-color="#071d2a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ab6"/>
      <stop offset="0.34" stop-color="#c084fc"/>
      <stop offset="0.68" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ab6" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#c084fc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="570" rx="38" fill="url(#bg2)"/>
  <text x="600" y="52" text-anchor="middle" fill="#fff7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="3">HOW YANA AI IS SHAPED</text>
  <text x="600" y="78" text-anchor="middle" fill="#b7a9c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Intelligence proposes. Deterministic systems and human authority decide.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <rect x="76" y="112" width="300" height="78" rx="22" fill="#ff7ab6" fill-opacity="0.08" stroke="#ff7ab6" stroke-opacity="0.48"/>
      <text x="226" y="143" text-anchor="middle" fill="#ffb4d5" font-size="15" font-weight="800" letter-spacing="1.5">LOCAL MODELS</text>
      <text x="226" y="169" text-anchor="middle" fill="#ddd3e6" font-size="14">Ollama · LM Studio · llama.cpp</text>
    </g>
    <g>
      <rect x="450" y="112" width="300" height="78" rx="22" fill="#c084fc" fill-opacity="0.08" stroke="#c084fc" stroke-opacity="0.46"/>
      <text x="600" y="143" text-anchor="middle" fill="#d8b4fe" font-size="15" font-weight="800" letter-spacing="1.5">CLOUD MODELS</text>
      <text x="600" y="169" text-anchor="middle" fill="#ddd3e6" font-size="14">Anthropic · OpenAI · compatible APIs</text>
    </g>
    <g>
      <rect x="824" y="112" width="300" height="78" rx="22" fill="#67e8f9" fill-opacity="0.07" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text x="974" y="143" text-anchor="middle" fill="#a5f3fc" font-size="15" font-weight="800" letter-spacing="1.5">CODING AGENTS</text>
      <text x="974" y="169" text-anchor="middle" fill="#ddd3e6" font-size="14">Claude Code · Codex · Cursor · Antigravity</text>
    </g>

    <path d="M226 190 V222 H600 M600 190 V222 M974 190 V222 H600" fill="none" stroke="url(#line)" stroke-width="2" stroke-opacity="0.68"/>
    <circle cx="600" cy="222" r="5" fill="#fff7fb"/>

    <rect x="230" y="230" width="740" height="72" rx="24" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="600" y="260" text-anchor="middle" fill="#f3e8ff" font-size="16" font-weight="800" letter-spacing="1.4">PROVIDERS + PROJECT ADAPTERS</text>
    <text x="600" y="283" text-anchor="middle" fill="#b7a9c6" font-size="14">One governed contract across model runtimes and developer tools</text>

    <path d="M600 302 V324" stroke="url(#line)" stroke-width="3"/>
    <rect x="170" y="326" width="860" height="104" rx="30" fill="url(#core)" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
    <text x="600" y="363" text-anchor="middle" fill="#fff7fb" font-size="25" font-weight="900" letter-spacing="4">YANA-RT</text>
    <text x="600" y="390" text-anchor="middle" fill="#e4d8ec" font-size="14">chat · capabilities · missions · routing · memory · evidence · workspace · health</text>
    <text x="600" y="414" text-anchor="middle" fill="#b7a9c6" font-size="13">The native Rust runtime — the deepest shared execution layer</text>

    <path d="M600 430 V451" stroke="url(#line)" stroke-width="3"/>
    <g>
      <rect x="78" y="458" width="320" height="76" rx="22" fill="#ff7ab6" fill-opacity="0.08" stroke="#ff7ab6" stroke-opacity="0.44"/>
      <text x="238" y="488" text-anchor="middle" fill="#ffb4d5" font-size="14" font-weight="800">DETERMINISTIC GOVERNANCE</text>
      <text x="238" y="513" text-anchor="middle" fill="#ddd3e6" font-size="13">capabilities · hooks · audit · quarantine</text>
    </g>
    <g>
      <rect x="440" y="458" width="320" height="76" rx="22" fill="#c084fc" fill-opacity="0.08" stroke="#c084fc" stroke-opacity="0.44"/>
      <text x="600" y="488" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="800">HUMAN AUTHORITY</text>
      <text x="600" y="513" text-anchor="middle" fill="#ddd3e6" font-size="13">approval · unlock · release · final decision</text>
    </g>
    <g>
      <rect x="802" y="458" width="320" height="76" rx="22" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.42"/>
      <text x="962" y="488" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="800">YANA OS + GIÁM THỊ</text>
      <text x="962" y="513" text-anchor="middle" fill="#ddd3e6" font-size="13">HALT · supervision · host health · receipts</text>
    </g>
  </g>
</svg>
